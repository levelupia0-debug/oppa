// --- SYSTÈME DE CACHE INTELLIGENT (LOCAL + FIREBASE CLOUD) ---
const fetchCached = async (url, cacheKey, ttl = 86400000) => {
    const firebaseDocId = encodeURIComponent(cacheKey); // Sécurise la clé pour empêcher Firebase de lire les "/" comme des dossiers

    // 1. Vérification en LocalStorage (Ultra rapide, 0 quota)
    try {
        const cached = localStorage.getItem(cacheKey);
        if (cached) {
            const parsed = JSON.parse(cached);
            if (Date.now() - parsed.time < ttl) return parsed.data;
        }
    } catch(e) {}

    // 2. Vérification dans Firebase (Sauvegarde entre appareils, 0 quota RAWG)
    if (globalUserId && db) {
        try {
            // Utilisation d'un cache spécifique à l'utilisateur
            const docRef = doc(db, "artifacts", APP_ID, "users", globalUserId, "api_cache", firebaseDocId);
            const snap = await getDoc(docRef);
            if (snap.exists()) {
                const parsed = snap.data();
                if (Date.now() - parsed.time < ttl) {
                    // On restaure en local pour accélérer la prochaine fois
                    try { localStorage.setItem(cacheKey, JSON.stringify(parsed)); } catch(e){}
                    return parsed.data;
                }
            }
        } catch(e) { console.warn("Erreur lecture Firebase Cache", e); }
    }

    // 3. Disjoncteur Anti-Spam (Évite le flood 401)
    if (url.includes('api.rawg.io') && isRawgDead) {
        return null;
    }

    // 4. Requête API (Ultime recours)
    try {
        const res = await fetch(url);
        
        if (!res.ok) {
            if (res.status === 401 || res.status === 403 || res.status === 429) {
                if (url.includes('api.rawg.io')) isRawgDead = true; // On coupe l'API RAWG
                window.dispatchEvent(new CustomEvent('api-error', { detail: res.status }));
                return null; // <-- CORRECTION: On retourne null sans déclencher le console.error en bas !
            }
            throw new Error(`Erreur réseau: ${res.status}`);
        }
        
        const text = await res.text();
        if (!text) return null;
        
        const data = JSON.parse(text);
        const cachePayload = { time: Date.now(), data };
        
        // Sauvegarde Local
        try { localStorage.setItem(cacheKey, JSON.stringify(cachePayload)); } 
        catch(e) { localStorage.clear(); localStorage.setItem(cacheKey, JSON.stringify(cachePayload)); }

        // Sauvegarde Firebase silencieuse (ne bloque pas le retour)
        if (globalUserId && db) {
            // Nettoyage des undefined pour Firebase
            const cleanPayload = JSON.parse(JSON.stringify(cachePayload));
            setDoc(doc(db, "artifacts", APP_ID, "users", globalUserId, "api_cache", firebaseDocId), cleanPayload)
                .catch(e => console.warn("Erreur écriture Firebase Cache", e));
        }

        return data;
    } catch (e) {
        // On log l'erreur proprement sans polluer
        console.error(`[API Bloquée] ${cacheKey} : ${e.message}`);
        return null; 
    }
};

// --- UTILITAIRES DE DATES ---
const getDates = () => {
    const today = new Date();
    const lastWeek = new Date(); lastWeek.setDate(today.getDate() - 7);
    const lastMonth = new Date(); lastMonth.setMonth(today.getMonth() - 1);
    const nextYear = new Date(); nextYear.setFullYear(today.getFullYear() + 1);
    
    return {
        today: today.toISOString().split('T')[0],
        lastWeek: lastWeek.toISOString().split('T')[0],
        lastMonth: lastMonth.toISOString().split('T')[0],
        nextYear: nextYear.toISOString().split('T')[0]
    };
};

function useDragToScroll() {
    const ref = useRef(null);
    useEffect(() => {
        const slider = ref.current;
        if (!slider) return;
        let isDown = false, startX, scrollLeft;
        const onMouseDown = (e) => { isDown = true; slider.classList.add('is-dragging'); startX = e.pageX - slider.offsetLeft; scrollLeft = slider.scrollLeft; };
        const onMouseLeave = () => { isDown = false; slider.classList.remove('is-dragging'); };
        const onMouseUp = () => { isDown = false; slider.classList.remove('is-dragging'); };
        const onMouseMove = (e) => { if (!isDown) return; e.preventDefault(); const x = e.pageX - slider.offsetLeft; const walk = (x - startX) * 2; slider.scrollLeft = scrollLeft - walk; };
        slider.addEventListener('mousedown', onMouseDown); slider.addEventListener('mouseleave', onMouseLeave); slider.addEventListener('mouseup', onMouseUp); slider.addEventListener('mousemove', onMouseMove);
        return () => { slider.removeEventListener('mousedown', onMouseDown); slider.removeEventListener('mouseleave', onMouseLeave); slider.removeEventListener('mouseup', onMouseUp); slider.removeEventListener('mousemove', onMouseMove); };
    }, []);
    return ref;
}

function InfiniteGameGrid({ endpoint, onGameClick }) {
    const [games, setGames] = useState([]);
    const [page, setPage] = useState(1);
    const [loading, setLoading] = useState(false);
    const [apiError, setApiError] = useState(false);
    const loaderRef = useRef(null);

    const loadMore = useCallback(async () => {
        if (loading || apiError || isRawgDead) return;
        setLoading(true);
        const data = await fetchCached(`${RAWG_BASE}${endpoint}&key=${RAWG_API_KEY}&page_size=24&page=${page}`, `infinite_${endpoint}_p${page}`);
        if (data && data.results) {
            setGames(prev => [...prev, ...data.results]);
            setPage(p => p + 1);
        } else if (!data && page === 1) {
            setApiError(true);
        }
        setLoading(false);
    }, [endpoint, page, loading, apiError]);

    useEffect(() => { setGames([]); setPage(1); setApiError(false); }, [endpoint]);

    useEffect(() => {
        const observer = new IntersectionObserver(entries => { if (entries[0].isIntersecting) loadMore(); }, { threshold: 0.1 });
        if (loaderRef.current) observer.observe(loaderRef.current);
        return () => observer.disconnect();
    }, [loadMore]);

    return (
        <div>
            {(apiError || isRawgDead) && games.length === 0 ? (
                <div className="flex flex-col items-center justify-center py-20 bg-[#151520] rounded-3xl border border-white/5 mt-8">
                    <AlertTriangle className="w-10 h-10 text-red-500 mb-4 opacity-50" />
                    <span className="text-white/50 text-xs font-bold uppercase tracking-widest text-center">Données hors ligne.<br/>Les quotas de l'API sont épuisés.</span>
                </div>
            ) : (
                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 md:gap-6">
                    {games.map((game, i) => <GameCard key={`${game.id}-${i}`} game={game} onClick={() => onGameClick(game)} />)}
                </div>
            )}
            <div ref={loaderRef} className="w-full h-20 flex items-center justify-center mt-8">
                {loading && <LoadingText />}
            </div>
        </div>
    );
}

function LiveSessionsPage({ onPlay }) {
    const [streams, setStreams] = useState([]);
    const [page, setPage] = useState(1);
    const [loading, setLoading] = useState(false);
    const [apiError, setApiError] = useState(false);
    const loaderRef = useRef(null);

    const loadMoreLives = useCallback(async () => {
        if(loading || isRawgDead || apiError) return;
        setLoading(true);
        try {
            const data = await fetchCached(`${RAWG_BASE}/games?tags=esports,multiplayer&ordering=-rating&page_size=20&page=${page}&key=${RAWG_API_KEY}`, `lives_games_p${page}`);
            
            // Si l'API renvoie null (Quota dépassé ou Clé expirée)
            if (!data) {
                setApiError(true);
                if (page === 1) { // Sécurité : On affiche un faux stream pour habiller la page si vide
                    setStreams([{ name: "[HORS LIGNE] Riot Games - LCS", thumbnail: "https://static-cdn.jtvnw.net/previews-ttv/live_user_riotgames-440x248.jpg", view_count: 0, external_id: "riotgames", gameObj: { name: "League of Legends" } }]);
                }
                setLoading(false);
                return;
            }

            const newGames = data.results || [];
            let newStreams = [];
            
            // FETCH SÉQUENTIEL (Au lieu de Promise.all) -> Protège contre le DDoS des requêtes Twitch et bloque si 401
            for (const g of newGames) {
                if (isRawgDead) break; // Arrêt immédiat si une des requêtes déclenche le disjoncteur 401
                const tData = await fetchCached(`${RAWG_BASE}/games/${g.id}/twitch?key=${RAWG_API_KEY}`, `lives_twitch_${g.id}`, 300000);
                if (tData && tData.results) {
                    tData.results.forEach(s => { if (s.external_id) newStreams.push({ ...s, gameObj: g }); });
                }
            }

            setStreams(prev => {
                const combined = [...prev, ...newStreams];
                const unique = Array.from(new Map(combined.map(s => [s.external_id, s])).values());
                return unique.sort((a,b) => b.view_count - a.view_count);
            });
            setPage(p => p + 1);
        } catch(e) {}
        setLoading(false);
    }, [page, loading, apiError]);

    useEffect(() => {
        const observer = new IntersectionObserver(entries => { if (entries[0].isIntersecting) loadMoreLives(); }, { threshold: 0.1 });
        if (loaderRef.current) observer.observe(loaderRef.current);
        return () => observer.disconnect();
    }, [loadMoreLives]);

    return (
        <div className="pt-28 md:pt-32 px-4 md:px-8 lg:px-12 pb-24 min-h-screen z-10 relative max-w-[1600px] mx-auto animate-in fade-in">
            <PageHeader title="Twitch Hub" subtitle="Réseau mondial de diffusions (Protégé par cache)" icon={<><Tv className="w-6 h-6 md:w-8 md:h-8 text-red-500" /><span className="absolute top-4 right-4 w-3 h-3 bg-red-500 rounded-full animate-pulse border-2 border-[#060608]"></span></>} color="from-red-500/10 to-transparent" borderColor="border-red-500/30" />
            
            {(apiError || isRawgDead) && streams.length === 0 ? (
                <div className="flex flex-col items-center justify-center py-20 bg-[#151520] rounded-3xl border border-white/5 mt-8">
                    <AlertTriangle className="w-10 h-10 text-red-500 mb-4 opacity-50" />
                    <span className="text-white/50 text-xs font-bold uppercase tracking-widest text-center">Aucun stream disponible.<br/>L'API RAWG est actuellement bloquée ou le quota est atteint.</span>
                </div>
            ) : (
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6">
                    {streams.map((s, idx) => (
                        <div key={idx} onClick={() => onPlay(s.gameObj, s)} className="bg-[#151520] border border-white/5 rounded-2xl overflow-hidden group cursor-pointer hover:border-red-500/50 transition-all shadow-xl flex flex-col h-full hover:-translate-y-1">
                            <div className="relative aspect-video w-full bg-[#060608]">
                                <img src={s.thumbnail} alt={s.name} className="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition-opacity" loading="lazy" />
                                <div className="absolute top-2 left-2 px-2 py-1 bg-red-600 text-white text-[9px] font-black uppercase tracking-widest rounded flex items-center gap-1.5 shadow-lg"><span className="w-1.5 h-1.5 bg-white rounded-full animate-pulse"></span> LIVE</div>
                                <div className="absolute bottom-2 right-2 px-2 py-1 bg-black/80 backdrop-blur text-white text-[9px] font-bold rounded flex items-center gap-1"><Users className="w-3 h-3 text-red-400" /> {s.view_count?.toLocaleString()}</div>
                            </div>
                            <div className="p-3 md:p-4 flex flex-col flex-1">
                                <div className="text-[9px] text-red-400 font-black uppercase tracking-[0.15em] mb-1 truncate">{s.gameObj.name}</div>
                                <h3 className="font-bold text-xs text-white/90 line-clamp-2 leading-snug">{s.name}</h3>
                            </div>
                        </div>
                    ))}
                </div>
            )}
            <div ref={loaderRef} className="w-full h-20 flex items-center justify-center mt-8">
                {loading && <LoadingText color="text-red-500" borderColor="border-red-500" />}
            </div>
        </div>
    );
}

function GameDetailHub({ gameId, initialGame, initialStream, onClose, user, db, APP_ID, watchlist, setWatchlist, showToast, stores, twitchConnected }) {
    const [game, setGame] = useState(initialGame);
    const [loading, setLoading] = useState(true);
    const [twitchData, setTwitchData] = useState([]);
    const [activeModal, setActiveModal] = useState(initialStream ? 'twitch' : null);

    useEffect(() => {
        const fetchGameDetails = async () => {
            const data = await fetchCached(`${RAWG_BASE}/games/${gameId}?key=${RAWG_API_KEY}`, `game_detail_${gameId}`);
            if(data) setGame(data);
            
            // Twitch request (5 min cache)
            if (!isRawgDead) {
                const tData = await fetchCached(`${RAWG_BASE}/games/${gameId}/twitch?key=${RAWG_API_KEY}`, `game_twitch_${gameId}`, 300000);
                setTwitchData(tData?.results?.filter(s => s.external_id) || []); // Seulement les valides
            }

            setLoading(false);
        };
        fetchGameDetails();
        document.body.style.overflow = 'hidden';
        return () => document.body.style.overflow = 'auto';
    }, [gameId]);

    const inWatchlist = watchlist.includes(game.id);

    const toggleWatchlist = async () => {
        let newList = [...watchlist];
        if (inWatchlist) { newList = newList.filter(id => id !== game.id); showToast("Radar désactivé", "info"); }

function TrailerModal({ game, onClose }) {
    const [videoUrl, setVideoUrl] = useState(null);
    const [videoType, setVideoType] = useState(null); // 'rawg', 'youtube_embed'
    const [loading, setLoading] = useState(true);

    useEffect(() => {
        const fetchTrailer = async () => {
            // 1. Tenter RAWG (Fichiers MP4 directs, haute qualité mais incomplet)
            const data = await fetchCached(`${RAWG_BASE}/games/${game.id}/movies?key=${RAWG_API_KEY}`, `trailer_${game.id}`);
            if (data?.results?.length > 0) { 
                setVideoUrl(data.results[0].data.max || data.results[0].data['480']); 
                setVideoType('rawg');
                setLoading(false);
                return;
            } 
            
            // 2. Plan B : YouTube Embed (Astuce d'intégration sans clé API !)
            // Utilise l'URL de recherche playlist pour forcer YouTube à embed le 1er résultat de recherche
            setVideoUrl(`https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(game.name + " official game trailer")}&autoplay=1`);
            setVideoType('youtube_embed');
            setLoading(false);
        };
        fetchTrailer();
    }, [game.id]);

    return (
        <div className="fixed inset-0 z-[9999] bg-[#060608]/95 backdrop-blur-xl flex items-center justify-center animate-in zoom-in-95 duration-300 p-4">
            <button onClick={onClose} className="absolute top-6 right-6 z-[10000] p-3 bg-white/10 hover:bg-white/20 rounded-full text-white backdrop-blur border border-white/20 transition-all outline-none shadow-2xl"><X className="w-6 h-6" /></button>
            <div className="w-full h-full max-h-[80vh] max-w-6xl mx-auto relative bg-[#060608] md:rounded-3xl overflow-hidden shadow-[0_0_80px_rgba(168,85,247,0.15)] md:border md:border-white/10 flex flex-col items-center justify-center">
                {loading ? <LoadingText /> : 
                 videoType === 'rawg' ? (
                     <video src={videoUrl} controls autoPlay className="w-full h-full object-contain bg-black"></video>
                 ) : (
                     <iframe src={videoUrl} allow="autoplay; encrypted-media; fullscreen" allowFullScreen className="w-full h-full border-none bg-black"></iframe>
                 )}
            </div>
        </div>
    );
}

    const parentParams = [...new Set(parents)].map(p => `parent=${p}`).join('&');

    return (
        <div className="fixed inset-0 z-[9999] bg-[#060608] flex flex-col animate-in slide-in-from-bottom duration-300">

                    <div>

                        <p className="text-[9px] md:text-[10px] text-white/40 uppercase tracking-widest">{game.name}</p>

                            const storeInfo = stores && stores[deal.storeID];
                            return (
                                <div key={idx} className="flex flex-col sm:flex-row sm:items-center justify-between bg-[#151520] p-4 md:p-6 rounded-2xl border border-white/5 hover:border-[#4ade80]/50 hover:bg-[#1a1a24] transition-all group shadow-xl">
                                    <div className="flex flex-col mb-4 sm:mb-0">
                                        <div className="flex items-center gap-3 mb-3">
                                            {storeInfo && storeInfo.images?.icon && <img src={`https://www.cheapshark.com${storeInfo.images.icon}`} alt={storeInfo.storeName} className="w-4 h-4 md:w-5 md:h-5 rounded" />}
                                            <span className="text-[9px] md:text-[10px] lg:text-xs text-white/70 uppercase font-black tracking-[0.2em]">{storeInfo ? storeInfo.storeName : `Boutique ${deal.storeID}`}</span>
                                        </div>
                                        <div className="flex items-center gap-3 md:gap-4">
                                            <span className="text-xl md:text-2xl lg:text-3xl font-black text-white">${deal.price}</span>
                                            {deal.retailPrice > deal.price && (
                                                <div className="flex flex-col">
                                                    <span className="text-[9px] md:text-[10px] lg:text-xs text-white/40 font-bold line-through">${deal.retailPrice}</span>
                                                    <span className="text-[8px] md:text-[9px] font-black text-[#4ade80] uppercase tracking-widest mt-0.5 bg-[#4ade80]/10 px-2 py-0.5 rounded w-fit">Éco {Math.round(deal.savings)}%</span>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                    <a href={`https://www.cheapshark.com/redirect?dealID=${deal.dealID}`} target="_blank" rel="noreferrer" className="px-4 py-3 md:px-6 md:py-4 bg-[#4ade80]/10 border border-[#4ade80]/30 text-[#4ade80] rounded-xl text-[10px] md:text-xs font-black uppercase tracking-[0.2em] hover:bg-[#4ade80] hover:text-black transition-all flex items-center justify-center gap-2 outline-none group-hover:shadow-[0_0_20px_rgba(74,222,128,0.4)] active:scale-95">
                                        Lien d'achat <ChevronRight className="w-3 h-3 md:w-4 md:h-4" />
                                    </a>
                                </div>
                            )
                        })}
                    </div>
                )}
            </div>
        </div>
    );
}

const root = createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
