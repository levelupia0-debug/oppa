const getDates = () => {
    const today = new Date();
    const lastWeek = new Date(); lastWeek.setDate(today.getDate() - 7);
    const lastMonth = new Date(); lastMonth.setMonth(today.getMonth() - 1);
    const nextYear = new Date(); nextYear.setFullYear(today.getFullYear() + 1);
    
    return {
        today: today.toISOString().split('T')[0],
        lastWeek: lastWeek.toISOString().split('T')[0],
        lastMonth: lastMonth.toISOString().split('T')[0],
        nextYear: nextYear.toISOString().split('T')[0]

};

function useDragToScroll() {
    const ref = useRef(null);
    useEffect(() => {
        const slider = ref.current;
        if (!slider) return;
        let isDown = false;
        let startX;
        let scrollLeft;

        const onMouseDown = (e) => {
            isDown = true;
            slider.classList.add('is-dragging');
            startX = e.pageX - slider.offsetLeft;
            scrollLeft = slider.scrollLeft;
        };
        const onMouseLeave = () => { isDown = false; slider.classList.remove('is-dragging'); };
        const onMouseUp = () => { isDown = false; slider.classList.remove('is-dragging'); };
        const onMouseMove = (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - slider.offsetLeft;
            const walk = (x - startX) * 2; 
            slider.scrollLeft = scrollLeft - walk;
        };

        slider.addEventListener('mousedown', onMouseDown);
        slider.addEventListener('mouseleave', onMouseLeave);
        slider.addEventListener('mouseup', onMouseUp);
        slider.addEventListener('mousemove', onMouseMove);

        return () => {
            slider.removeEventListener('mousedown', onMouseDown);
            slider.removeEventListener('mouseleave', onMouseLeave);
            slider.removeEventListener('mouseup', onMouseUp);
            slider.removeEventListener('mousemove', onMouseMove);
        };
    }, []);
    return ref;
}

];

    const [isSearching, setIsSearching] = useState(false);
    
    const [platformFilter, setPlatformFilter] = useState(''); 
    
    const [heroGame, setHeroGame] = useState(null);
    const [selectedGameData, setSelectedGameData] = useState(null); // Contient { game, stream }
    
    const [watchlist, setWatchlist] = useState([]);
    const [watchlistGames, setWatchlistGames] = useState([]);

        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {

        initAuth();
        
        const unsubscribe = onAuthStateChanged(auth, (u) => {
            if (u) {
                setUser({ uid: u.uid, name: `Joueur_${u.uid.substring(0,5)}` });
                fetchWatchlist(u.uid);
            }
        });
        return () => unsubscribe();
    }, []);

    const fetchWatchlist = async (uid) => {
        try {
            const snap = await getDoc(doc(db, "artifacts", APP_ID, "users", uid, "data", "watchlist"));
            if (snap.exists()) {
                const ids = snap.data().games || [];
                setWatchlist(ids);
                fetchWatchlistGames(ids);
            }
        } catch(e) {}
    };

    const fetchWatchlistGames = async (ids) => {
        if (!ids || ids.length === 0) return setWatchlistGames([]);
        try {
            const promises = ids.map(id => fetch(`${RAWG_BASE}/games/${id}?key=${RAWG_API_KEY}`).then(r => r.json()));
            const games = await Promise.all(promises);
            setWatchlistGames(games.filter(g => !g.detail)); 
        } catch(e) {}
    };

    useEffect(() => {
        const handleScroll = () => setIsScrolled(window.scrollY > 20);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
    }, []);

    const showToast = useCallback((msg, type = 'info') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, msg, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
    }, []);

    useEffect(() => {
        if (!searchQuery.trim()) return setSearchResults([]);
        const delayDebounceFn = setTimeout(async () => {
            setIsSearching(true);
            try {
                const res = await fetch(`${RAWG_BASE}/games?key=${RAWG_API_KEY}&search=${encodeURIComponent(searchQuery)}&page_size=16`);
                const data = await res.json();
                setSearchResults(data.results || []);
            } catch (e) { }
            setIsSearching(false);
        }, 500);
        return () => clearTimeout(delayDebounceFn);
    }, [searchQuery]);

    // Modifié pour accepter un stream initial
    const openGameModal = (game, stream = null) => {
        setSelectedGameData({ game, stream });
        window.history.pushState({ modal: true }, "");
    };

    const closeGameModal = () => {
        setSelectedGameData(null);
    };

    useEffect(() => {
        const handlePopState = () => setSelectedGameData(null);
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
    }, []);

    const navigateTo = (cat) => {

        setSearchQuery('');
        window.scrollTo({ top: 0, behavior: 'smooth' });

            gameObj: { id: 436173, name: "VALORANT", background_image: "https://media.rawg.io/media/games/b11/b115b2bc6a5957a917bc7601f4abdda2.jpg" }
        },
        {

        },

        }
    ];

    useEffect(() => {
        const fetchLives = async () => {
            try {
                const res = await fetch(`${RAWG_BASE}/games?ordering=-added&page_size=40&key=${RAWG_API_KEY}`);
                const gamesData = await res.json();
                
                let allStreams = [];
                const promises = gamesData.results.map(async (g) => {
                    try {
                        const tRes = await fetch(`${RAWG_BASE}/games/${g.id}/twitch?key=${RAWG_API_KEY}`);
                        const tData = await tRes.json();
                        
                        if (tData.results && tData.results.length > 0) {
                            tData.results.forEach(s => {
                                if (s.external_id) {
                                    allStreams.push({ ...s, gameObj: g });
                                }
                            });
                        }
                    } catch (e) {} 
                });
                
                await Promise.all(promises);
                allStreams.sort((a, b) => b.view_count - a.view_count);

                const uniqueStreams = [];
                const seenIds = new Set();
                for (let s of allStreams) {
                    if (!seenIds.has(s.external_id)) {
                        seenIds.add(s.external_id);
                        uniqueStreams.push(s);
                    }
                }

                // SI L'API RAWG EST CASSÉE (Ce qui arrive souvent), ON INJECTE NOTRE LISTE GARANTIE
                if (uniqueStreams.length === 0) {
                    setStreams(FALLBACK_STREAMS);
                } else {
                    setStreams(uniqueStreams.slice(0, 20));
                }
                
                setLoading(false);
            } catch(e) { 
                // En cas d'erreur réseau, on utilise le Fallback
                setStreams(FALLBACK_STREAMS);
                setLoading(false); 
            }
        };
        fetchLives();
    }, []);

    return (
        <div className="pt-28 md:pt-32 px-4 md:px-12 pb-24 min-h-screen z-10 relative max-w-[1600px] mx-auto animate-in fade-in duration-500">

            {loading ? (
                <div className="flex justify-center py-32"><Zap className="w-10 h-10 text-red-500 animate-pulse" /></div>
            ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    {streams.map((s, idx) => (
                        <div key={idx} onClick={() => onPlay(s.gameObj, s)} className="bg-[#151520] border border-white/5 rounded-2xl overflow-hidden group cursor-pointer hover:border-red-500/50 transition-all shadow-xl flex flex-col h-full hover:scale-[1.02]">
                            <div className="relative aspect-video w-full bg-[#060608]">
                                <img src={s.thumbnail} alt={s.name} className="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition-opacity" loading="lazy" />
                                <div className="absolute top-2 left-2 px-2.5 py-1 bg-red-600 text-white text-[9px] font-black uppercase tracking-widest rounded flex items-center gap-1.5 shadow-lg">
                                    <span className="w-1.5 h-1.5 bg-white rounded-full animate-pulse"></span> LIVE
                                </div>
                                <div className="absolute bottom-2 right-2 px-2 py-1 bg-black/80 backdrop-blur text-white text-[10px] font-bold rounded flex items-center gap-1.5">
                                    <Users className="w-3 h-3 text-red-400" /> {s.view_count?.toLocaleString()}
                                </div>
                                <div className="absolute inset-0 bg-gradient-to-t from-[#151520] via-transparent to-transparent opacity-60 group-hover:opacity-100 transition-opacity"></div>
                            </div>
                            <div className="p-5 flex flex-col flex-1">
                                <div className="text-xs text-red-400 font-black uppercase tracking-[0.15em] mb-2 truncate">{s.gameObj.name}</div>
                                <h3 className="font-bold text-sm text-white/90 mb-2 line-clamp-2 leading-snug">{s.name}</h3>
                                <p className="text-[11px] text-white/40 line-clamp-2 mt-auto italic">"{s.description || "Aucune description"}"</p>
                            </div>
                        </div>
                    ))}
                </div>
            )}
        </div>
    );
}

// --- LE HUB DU JEU ---
function GameDetailHub({ gameId, initialGame, initialStream, onClose, user, db, APP_ID, watchlist, setWatchlist, showToast }) {
    const [game, setGame] = useState(initialGame);
    const [loading, setLoading] = useState(true);
    const [twitchData, setTwitchData] = useState([]);
    
    // Si on arrive depuis la page des Lives, on ouvre directement le modal Twitch !
    const [activeModal, setActiveModal] = useState(initialStream ? 'twitch' : null);

    useEffect(() => {
        const fetchGameDetails = async () => {
            try {
                const res = await fetch(`${RAWG_BASE}/games/${gameId}?key=${RAWG_API_KEY}`);
                const data = await res.json();
                setGame(data);
                
                // Fetch Twitch Streams for this game
                const tRes = await fetch(`${RAWG_BASE}/games/${gameId}/twitch?key=${RAWG_API_KEY}`);
                const tData = await tRes.json();
                setTwitchData(tData.results || []);

                setLoading(false);
            } catch(e) { setLoading(false); }
        };
        fetchGameDetails();
        document.body.style.overflow = 'hidden';
        return () => document.body.style.overflow = 'auto';
    }, [gameId]);

    const inWatchlist = watchlist.includes(game.id);

    const toggleWatchlist = async () => {
        let newList = [...watchlist];
        if (inWatchlist) { newList = newList.filter(id => id !== game.id); showToast("Radar désactivé", "info"); } 
        else { newList.push(game.id); showToast("Cible ajoutée au radar", "success"); }
        setWatchlist(newList);
        try { await setDoc(doc(db, "artifacts", APP_ID, "users", user.uid, "data", "watchlist"), { games: newList }, { merge: true }); } catch(e) {}
    };

    if (activeModal === 'trailer') return <TrailerModal game={game} onClose={() => setActiveModal(null)} />;
    // On passe l'initialStream à TwitchModal pour garantir qu'on regarde bien le live qu'on a cliqué
    if (activeModal === 'twitch') return <TwitchModal game={game} twitchStreams={twitchData} initialStream={initialStream} onClose={() => setActiveModal(null)} />;
    if (activeModal === 'deals') return <DealsModal gameName={game.name} onClose={() => setActiveModal(null)} />;

    // LE HUB PRINCIPAL
    return (
        <div className="fixed inset-0 z-[9000] bg-[#060608] overflow-y-auto no-scrollbar animate-in fade-in duration-300">
            <button onClick={onClose} className="fixed top-4 right-4 md:top-6 md:right-6 z-[9999] p-2 md:p-3 bg-black/40 hover:bg-[#a855f7] rounded-full text-white/70 hover:text-white backdrop-blur border border-white/10 transition-all outline-none shadow-lg">
                <X className="w-5 h-5 md:w-6 md:h-6" />
            </button>

            {/* HERO BANNER DU HUB */}
            <div className="relative w-full h-[40vh] md:h-[60vh] bg-[#060608]">
                <div className="absolute inset-0 z-0">
                    <img src={game.background_image} alt="" className="w-full h-full object-cover opacity-30" />
                    <div className="absolute inset-0 bg-gradient-to-t from-[#060608] via-[#060608]/80 to-transparent"></div>
                    <div className="absolute inset-0 bg-gradient-to-r from-[#060608] via-transparent to-transparent opacity-90"></div>
                </div>
            </div>

            {/* CONTENU HUB REMONTANT */}
            <div className="relative z-20 max-w-7xl mx-auto px-4 md:px-12 -mt-32 md:-mt-48 pb-24">
                <div className="flex flex-col md:flex-row gap-8 md:gap-12 items-start mb-12">
                    <div className="hidden md:block w-56 shrink-0 rounded-3xl overflow-hidden shadow-[0_20px_50px_rgba(0,0,0,0.5)] border border-white/10 bg-[#151520] aspect-[2/3] relative">
                        <img src={game.background_image} alt="" className="w-full h-full object-cover opacity-90" />
                        <div className="absolute inset-0 ring-1 ring-inset ring-white/10 rounded-3xl"></div>
                    </div>
                    
                    <div className="flex-1 mt-auto w-full">
                        <h1 className="text-4xl md:text-7xl font-black uppercase tracking-tight text-white drop-shadow-2xl mb-4 md:mb-6 leading-none">{game.name}</h1>
                        
                        <div className="flex flex-wrap items-center gap-3 md:gap-4 text-[10px] md:text-xs font-bold uppercase tracking-widest text-white/50 mb-6 md:mb-8">
                            <span className="bg-[#151520] px-3 py-1.5 md:px-4 md:py-2 rounded-lg border border-white/5 shadow-inner">{game.released?.substring(0,4)}</span>
                            <span className="bg-[#151520] px-3 py-1.5 md:px-4 md:py-2 rounded-lg border border-white/5 shadow-inner">{game.playtime ? `${game.playtime}H Moyen` : 'Durée N/A'}</span>
                            {game.metacritic && <span className="text-[#00ffcc] bg-[#00ffcc]/10 px-3 py-1.5 md:px-4 md:py-2 rounded-lg border border-[#00ffcc]/20 shadow-[0_0_15px_rgba(0,255,204,0.1)]">Metascore {game.metacritic}</span>}
                        </div>

                        <div className="flex gap-4">
                            <button onClick={toggleWatchlist} className={`px-6 py-4 md:px-8 md:py-4 rounded-xl text-xs font-black uppercase tracking-[0.2em] transition-all flex items-center justify-center gap-3 outline-none ${inWatchlist ? 'bg-[#151520] border border-white/10 text-white hover:bg-white/5' : 'bg-white text-black hover:bg-[#a855f7] hover:text-white shadow-[0_0_30px_rgba(255,255,255,0.15)] active:scale-95'}`}>
                                {inWatchlist ? <><CheckCircle className="w-4 h-4" /> Dans le Radar</> : <><Plus className="w-4 h-4" /> Ajouter au Radar</>}
                            </button>
                        </div>
                    </div>
                </div>

                {loading ? (
                    <div className="flex justify-center py-20"><Zap className="w-10 h-10 text-[#a855f7] animate-pulse" /></div>
                ) : (
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 md:gap-12">
                        {/* Colonne de Gauche : Le Briefing */}
                        <div className="lg:col-span-2 space-y-8">
                            <div>
                                <h3 className="text-white/90 text-sm md:text-xl font-black mb-6 uppercase tracking-[0.2em] border-l-4 border-[#a855f7] pl-3 md:pl-4">Archive & Briefing</h3>
                                <div className="markdown text-xs md:text-base text-justify" dangerouslySetInnerHTML={{ __html: game.description || game.description_raw || "Aucune donnée trouvée." }} />
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div className="bg-[#151520] p-6 rounded-2xl border border-white/5">
                                    <span className="text-white/30 font-bold block mb-2 uppercase tracking-[0.2em] text-[10px] flex items-center gap-2"><Info className="w-4 h-4 text-[#a855f7]" /> Développeur</span>
                                    <span className="text-white/90 font-bold text-sm block">{game.developers?.[0]?.name || 'Inconnu'}</span>
                                </div>
                                <div className="bg-[#151520] p-6 rounded-2xl border border-white/5">
                                    <span className="text-white/30 font-bold block mb-2 uppercase tracking-[0.2em] text-[10px] flex items-center gap-2"><Users className="w-4 h-4 text-[#a855f7]" /> Éditeur</span>
                                    <span className="text-white/90 font-bold text-sm block">{game.publishers?.[0]?.name || 'Inconnu'}</span>
                                </div>
                            </div>
                        </div>

                        {/* Colonne de Droite : Boutons d'Action */}
                        <div className="space-y-4">
                            <h3 className="text-white/90 text-sm md:text-xl font-black mb-6 uppercase tracking-[0.2em] border-l-4 border-[#a855f7] pl-3 md:pl-4">Systèmes Intégrés</h3>
                            
                            <button onClick={() => setActiveModal('trailer')} className="w-full bg-[#151520] hover:bg-white/5 border border-white/10 hover:border-white/30 p-6 md:p-8 rounded-3xl flex flex-col items-center justify-center gap-4 transition-all group outline-none shadow-xl hover:shadow-2xl hover:-translate-y-1">
                                <div className="w-16 h-16 rounded-full bg-white/5 border border-white/10 flex items-center justify-center group-hover:bg-white group-hover:text-black transition-colors">
                                    <Play className="w-6 h-6 fill-current" />
                                </div>
                                <span className="font-black uppercase tracking-[0.2em] text-sm group-hover:text-white text-white/70">Bande Annonce</span>
                            </button>

                            <button onClick={() => setActiveModal('twitch')} className="w-full bg-[#151520] hover:bg-red-500/10 border border-white/10 hover:border-red-500/30 p-6 md:p-8 rounded-3xl flex flex-col items-center justify-center gap-4 transition-all group outline-none shadow-xl hover:shadow-[0_10px_30px_rgba(239,68,68,0.15)] hover:-translate-y-1 relative overflow-hidden">
                                {twitchData.length > 0 && <span className="absolute top-4 right-4 flex h-3 w-3"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span className="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span></span>}
                                <div className="w-16 h-16 rounded-full bg-red-500/10 border border-red-500/20 flex items-center justify-center group-hover:bg-red-500 group-hover:text-white transition-colors text-red-500">
                                    <Tv className="w-6 h-6" />
                                </div>
                                <span className="font-black uppercase tracking-[0.2em] text-sm group-hover:text-red-400 text-white/70 flex flex-col items-center gap-1">
                                    Live Twitch
                                    {twitchData.length > 0 && <span className="text-[9px] text-white/40 group-hover:text-red-300">Sessions Actives</span>}
                                </span>
                            </button>

                            <button onClick={() => setActiveModal('deals')} className="w-full bg-[#151520] hover:bg-[#4ade80]/10 border border-white/10 hover:border-[#4ade80]/30 p-6 md:p-8 rounded-3xl flex flex-col items-center justify-center gap-4 transition-all group outline-none shadow-xl hover:shadow-[0_10px_30px_rgba(74,222,128,0.15)] hover:-translate-y-1">
                                <div className="w-16 h-16 rounded-full bg-[#4ade80]/10 border border-[#4ade80]/20 flex items-center justify-center group-hover:bg-[#4ade80] group-hover:text-black transition-colors text-[#4ade80]">
                                    <ShoppingCart className="w-6 h-6" />
                                </div>
                                <span className="font-black uppercase tracking-[0.2em] text-sm group-hover:text-[#4ade80] text-white/70">Boutiques & Deals</span>
                            </button>
                        </div>
                    </div>
                )}
            </div>
        </div>
    );
}

function TrailerModal({ game, onClose }) {
    const [videoUrl, setVideoUrl] = useState(null);
    const [loading, setLoading] = useState(true);

    useEffect(() => {
        const fetchTrailer = async () => {
            try {
                const res = await fetch(`${RAWG_BASE}/games/${game.id}/movies?key=${RAWG_API_KEY}`);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    setVideoUrl(data.results[0].data.max || data.results[0].data['480']);
                } else {
                    setVideoUrl('youtube'); // Déclenche le iframe YouTube
                }
            } catch(e) { setVideoUrl('youtube'); }
            setLoading(false);
        };
        fetchTrailer();
    }, [game.id]);

    return (
        <div className="fixed inset-0 z-[9999] bg-[#060608]/95 backdrop-blur-xl flex items-center justify-center animate-in zoom-in-95 duration-300 p-4">
            <button onClick={onClose} className="absolute top-6 right-6 z-[10000] p-3 bg-white/10 hover:bg-white/20 rounded-full text-white backdrop-blur border border-white/20 transition-all outline-none shadow-2xl"><X className="w-6 h-6" /></button>
            <div className="w-full h-full max-h-[80vh] max-w-6xl mx-auto relative bg-[#060608] md:rounded-3xl overflow-hidden shadow-[0_0_80px_rgba(168,85,247,0.15)] md:border md:border-white/10 flex flex-col items-center justify-center">
                {loading ? <Zap className="w-10 h-10 text-[#a855f7] animate-pulse" /> : 
                 videoUrl === 'youtube' ? (
                     // IFRAME YOUTUBE FIABLE (Recherche direct intégrée)
                     <iframe 
                        className="w-full h-full border-none bg-black" 
                        src={`https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(game.name + " official gameplay trailer")}`} 
                        allow="autoplay; encrypted-media" 
                        allowFullScreen>
                     </iframe>
                 ) : (
                     <video src={videoUrl} controls autoPlay className="w-full h-full object-contain bg-black"></video>
                 )}
            </div>
        </div>
    );
}

function TwitchModal({ game, twitchStreams, initialStream, onClose }) {
    // Si on a un stream cliqué depuis la page Live, on l'utilise. 
    // Sinon on prend le premier valide.
    const validStreams = twitchStreams.filter(s => s.external_id);
    const defaultStream = initialStream || (validStreams.length > 0 ? validStreams[0] : null);
    const [selectedStream, setSelectedStream] = useState(defaultStream);
    
    let currentDomain = window.location.hostname;
    if (!currentDomain || currentDomain === "127.0.0.1") currentDomain = "localhost";
    const parents = [currentDomain, "localhost", "levelup-ecosystem.com", "gaming.levelup-ecosystem.com"];
    const parentParams = [...new Set(parents)].map(p => `parent=${p}`).join('&');

    // SI VRAIMENT AUCUN STREAM N'EXISTE POUR CE JEU, ON AFFICHE UN MESSAGE PROPRE (Sans Iframe)
    if (!selectedStream) {
        return (
            <div className="fixed inset-0 z-[9999] bg-[#060608] flex flex-col animate-in slide-in-from-bottom duration-300">
                <div className="flex justify-between items-center p-4 bg-[#151520] border-b border-white/5 shrink-0 shadow-lg relative z-10">
                    <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-xl bg-red-500/10 flex items-center justify-center border border-red-500/20 text-red-500"><Tv className="w-5 h-5" /></div>
                        <div>
                            <h3 className="text-xs md:text-sm font-black text-white uppercase tracking-[0.2em]">Twitch Immersif</h3>
                            <p className="text-[9px] md:text-[10px] text-white/40 uppercase tracking-widest">{game.name}</p>
                        </div>
                    </div>
                    <button onClick={onClose} className="p-2 bg-white/5 hover:bg-white/10 rounded-full text-white/70 hover:text-white transition-all outline-none"><X className="w-5 h-5" /></button>
                </div>
                <div className="flex-1 flex flex-col items-center justify-center p-8 text-center bg-[#060608]">
                    <Tv className="w-16 h-16 text-red-500 opacity-50 mb-6" />
                    <h3 className="text-xl md:text-2xl font-black text-white uppercase tracking-widest mb-4">Aucun Stream Actif</h3>
                    <p className="text-white/60 text-sm max-w-md">Aucune chaîne ne diffuse actuellement ce jeu sur Twitch.</p>
                </div>
            </div>
        );
    }

    // SI LE STREAM EXISTE, ON AFFICHE LE VRAI LECTEUR !
    return (
        <div className="fixed inset-0 z-[9999] bg-[#060608] flex flex-col animate-in slide-in-from-bottom duration-300">
            <div className="flex justify-between items-center p-4 bg-[#151520] border-b border-white/5 shrink-0 shadow-lg relative z-10">
                <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-red-500/10 flex items-center justify-center border border-red-500/20 text-red-500"><Tv className="w-5 h-5" /></div>
                    <div>
                        <h3 className="text-xs md:text-sm font-black text-white uppercase tracking-[0.2em]">Twitch Immersif</h3>
                        <p className="text-[9px] md:text-[10px] text-white/40 uppercase tracking-widest">{game.name}</p>
                    </div>
                </div>
                <button onClick={onClose} className="p-2 bg-white/5 hover:bg-white/10 rounded-full text-white/70 hover:text-white transition-all outline-none"><X className="w-5 h-5" /></button>
            </div>

            <div className="flex flex-col md:flex-row flex-1 overflow-hidden relative">
                {/* LECTEUR PRINCIPAL */}
                <div className="flex-1 bg-black relative">
                    <iframe src={`https://player.twitch.tv/?channel=${selectedStream.external_id}&${parentParams}&muted=false`} height="100%" width="100%" allowFullScreen className="absolute inset-0 w-full h-full border-none"></iframe>
                </div>

                {/* SIDEBAR : CHAT ET AUTRES STREAMS */}
                <div className="w-full md:w-[350px] lg:w-[400px] h-[50vh] md:h-full bg-[#0e0e14] border-t md:border-t-0 md:border-l border-white/5 flex flex-col shrink-0">
                    <div className="flex-1 min-h-[300px]">
                        <iframe src={`https://www.twitch.tv/embed/${selectedStream.external_id}/chat?${parentParams}&darkpopout`} height="100%" width="100%" className="border-none w-full h-full"></iframe>
                    </div>
                    
                    {validStreams.length > 1 && (
                        <div className="h-[200px] overflow-y-auto no-scrollbar border-t border-white/5 bg-[#151520] p-4">
                            <h4 className="text-[10px] font-black text-white/40 uppercase tracking-[0.2em] mb-4">Autres Sessions Actives</h4>
                            <div className="space-y-3">
                                {validStreams.map((s, idx) => {
                                    if (s.external_id === selectedStream.external_id) return null;
                                    return (
                                        <div key={idx} onClick={() => setSelectedStream(s)} className="flex gap-3 items-center group cursor-pointer p-2 rounded-xl hover:bg-white/5 transition-colors">
                                            <div className="w-20 h-12 bg-black rounded-lg overflow-hidden shrink-0 relative">
                                                <img src={s.thumbnail} className="w-full h-full object-cover opacity-80 group-hover:opacity-100" />
                                                <div className="absolute top-1 left-1 w-2 h-2 bg-red-500 rounded-full animate-pulse"></div>
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <div className="text-[10px] text-white/90 font-bold truncate">{s.name}</div>
                                                <div className="text-[9px] text-red-400 font-bold flex items-center gap-1 mt-1"><Users className="w-3 h-3"/> {s.view_count?.toLocaleString()} spectateurs</div>
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    )}
                </div>
            </div>
        </div>
    );
}

function DealsModal({ gameName, onClose }) {
    const [deals, setDeals] = useState([]);
    const [loading, setLoading] = useState(true);

    useEffect(() => {
        const fetchDeals = async () => {
            try {
                const res = await fetch(`${CHEAPSHARK_BASE}/games?title=${encodeURIComponent(gameName)}&limit=10`);
                const data = await res.json();
                if (data && data.length > 0) {
                    const exactMatch = data[0]; 
                    const dealsRes = await fetch(`${CHEAPSHARK_BASE}/games?id=${exactMatch.gameID}`);
                    const dealsData = await dealsRes.json();
                    setDeals(dealsData.deals || []);
                } else {
                    setDeals([]);
                }
                setLoading(false);
            } catch(e) { setLoading(false); }
        };
        fetchDeals();
    }, [gameName]);

    return (
        <div className="fixed inset-0 z-[9999] bg-[#060608] flex flex-col animate-in slide-in-from-bottom duration-300 overflow-y-auto">
            <div className="flex justify-between items-center p-6 bg-[#151520] border-b border-white/5 sticky top-0 z-50">
                <div className="flex items-center gap-4">
                    <div className="w-12 h-12 rounded-2xl bg-[#4ade80]/10 flex items-center justify-center border border-[#4ade80]/20 text-[#4ade80]"><ShoppingCart className="w-6 h-6" /></div>
                    <div>
                        <h3 className="text-sm md:text-xl font-black text-white uppercase tracking-[0.2em]">Radar de Boutiques</h3>
                        <p className="text-[10px] md:text-xs text-white/40 uppercase tracking-widest">{gameName}</p>

                <button onClick={onClose} className="p-3 bg-white/5 hover:bg-white/10 rounded-full text-white/70 hover:text-white transition-all outline-none"><X className="w-6 h-6" /></button>

            <div className="p-6 md:p-12 max-w-7xl mx-auto w-full">

                                        <span className="text-2xl md:text-3xl font-black text-white">${deal.price}</span>

                                    href={`https://www.cheapshark.com/redirect?dealID=${deal.dealID}`} target="_blank" rel="noreferrer"
                                    className="px-4 py-3 md:px-6 md:py-4 bg-white text-black rounded-xl text-[10px] md:text-xs font-black uppercase tracking-[0.2em] hover:bg-[#4ade80] transition-all flex items-center justify-center gap-2 outline-none group-hover:shadow-[0_0_20px_rgba(74,222,128,0.4)] active:scale-95"
                                >
                                    Voir <ChevronRight className="w-3 h-3 md:w-4 md:h-4" />
                                </a>
                            </div>
                        ))}
                    </div>
                )}
            </div>
        </div>
    );
}

const root = createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
